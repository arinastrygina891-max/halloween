    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        horror: {
                            bg: '#090212',
                            card: '#120524',
                            green: '#39ff14',
                            slime: '#70e000',
                            magenta: '#ff007f',
                            purple: '#8a2be2',
                            dark: '#05010a'
                        }
                    },
                    fontFamily: {
                        sans: ['VT323', 'monospace'],
                        creepster: ['Creepster', 'cursive'],
                        glitch: ['Rubik Glitch', 'cursive']
                    },
                    animation: {
                        'pulse-fast': 'pulse 0.6s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float-ghost': 'floatGhost 6s ease-in-out infinite',
                        'toxic-glow': 'toxicGlow 1.8s ease-in-out infinite alternate',
                        'flicker': 'vhsFlicker 0.15s infinite'
                    },
                    keyframes: {
                        floatGhost: {
                            '0%, 100%': { transform: 'translateY(0px) translateX(0px) scale(1)', opacity: '0.3' },
                            '50%': { transform: 'translateY(-20px) translateX(12px) scale(1.1)', opacity: '0.6' }
                        },
                        toxicGlow: {
                            '0%': { boxShadow: '0 0 10px #39ff14, 0 0 20px #39ff14, inset 0 0 10px rgba(57, 255, 20, 0.2)' },
                            '100%': { boxShadow: '0 0 20px #39ff14, 0 0 35px #ff007f, inset 0 0 20px rgba(255, 0, 127, 0.3)' }
                        },
                        vhsFlicker: {
                            '0%': { opacity: '0.97' },
                            '50%': { opacity: '1' },
                            '100%': { opacity: '0.94' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background: radial-gradient(circle at 50% 20%, #1a0833 0%, #0d031c 50%, #040108 100%);
            color: #f3f4f6;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
            font-family: 'VT323', monospace;
            font-size: 1.15rem;
        }

        /* 90s VHS Retro Noise & Scanline Overlay */
        .vhs-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 50;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 6px 100%;
            opacity: 0.8;
        }

        /* Toxic Neon Glow Effects */
        .neon-text-green {
            color: #39ff14;
            text-shadow: 0 0 5px #39ff14, 0 0 12px #39ff14, 0 0 25px #39ff14;
        }

        .neon-text-magenta {
            color: #ff007f;
            text-shadow: 0 0 5px #ff007f, 0 0 15px #ff007f, 0 0 30px #8a2be2;
        }

        .toxic-border {
            border: 2px solid #39ff14;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.5), inset 0 0 10px rgba(57, 255, 20, 0.2);
        }

        .magenta-border {
            border: 2px solid #ff007f;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.5), inset 0 0 10px rgba(255, 0, 127, 0.2);
        }

        .spooky-card {
            background: linear-gradient(160deg, #180730 0%, #0c021a 100%);
            border: 2px solid #ff007f;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.3), 0 0 35px rgba(57, 255, 20, 0.2);
            position: relative;
        }

        /* Tentacle frame overlays using SVG background patterns */
        .tentacle-frame {
            position: relative;
        }
        .tentacle-frame::before {
            content: '';
            position: absolute;
            inset: -8px;
            border: 2px dashed #39ff14;
            border-radius: 1.5rem;
            pointer-events: none;
            opacity: 0.6;
            animation: toxicGlow 2s infinite alternate;
        }

        /* Swipe Card Animation */
        .card-container {
            perspective: 1000px;
        }

        .swipe-card {
            transition: transform 0.2s ease, opacity 0.2s ease;
            will-change: transform, opacity;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #080212; }
        ::-webkit-scrollbar-thumb { background: #ff007f; border-radius: 3px; }
    </style>

           2. WEB AUDIO API SYNTHESIZER (NO EXTERNAL AUDIO FILES)

        class SoundFX {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playCorrect() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.15); // A5

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.25);
            }

            playSkip() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now); // A3
                osc.frequency.exponentialRampToValueAtTime(110, now + 0.2); // A2

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.25);
            }

            playTick() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.05);

                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.05);
            }

            playVictory() {
                if (!this.enabled) return;
                this.init();
                const notes = [440, 554.37, 659.25, 880];
                notes.forEach((freq, idx) => {
                    const now = this.ctx.currentTime + idx * 0.12;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now);

                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + 0.3);
                });
            }
        }

        const soundFX = new SoundFX();

        function toggleAudio() {
            soundFX.enabled = !soundFX.enabled;
            const btn = document.getElementById('audio-toggle');
            if (soundFX.enabled) {
                btn.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
                btn.classList.remove('text-gray-500');
                btn.classList.add('text-amber-400');
                soundFX.playCorrect();

                btn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
                btn.classList.remove('text-amber-400');
                btn.classList.add('text-gray-500');
            }
        }

        function renderReviewScreen() {
            const currentTeam = gameState.teams[gameState.currentTeamIndex];
            
            let turnScore = 0;

            return `
